name: Build DailyFortune iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # 支持手动触发

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build DailyFortune (无签名)
        run: |
          xcodebuild -project DailyFortune.xcodeproj \
            -scheme DailyFortune \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包为 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DailyFortune.app Payload/
          zip -r DailyFortune.ipa Payload

      - name: 上传 IPA 工件
        uses: actions/upload-artifact@v4
        with:
          name: DailyFortune-ipa
          path: DailyFortune.ipa
          if-no-files-found: error
