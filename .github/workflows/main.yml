name: Build DailyFortune iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest # 必须用 macOS 环境，自带 Xcode 和 iOS SDK

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build DailyFortune (无签名)
        run: |
          xcodebuild -project DailyFortune.xcodeproj \
            -scheme DailyFortune \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
